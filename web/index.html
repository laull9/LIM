<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#081623" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230f8b8d'/%3E%3Cpath d='M5 15c2.8-4 5.6-4 8.4 0s5.6 4 8.4 0 3.6-3 5.2 0' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M5 22c2.8-4 5.6-4 8.4 0s5.6 4 8.4 0 3.6-3 5.2 0' stroke='%23f26b4e' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>LIM · 潮汐聊天</title>
    <script>
      // 涨潮（深色）为默认外观，可在导轨上切换为退潮（浅色）
      try {
        if (localStorage.getItem('lim-theme') === 'light') {
          document.documentElement.classList.remove('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e9f0f1')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
